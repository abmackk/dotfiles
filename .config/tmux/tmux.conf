##### Prefix (Ctrl+Space only) #####
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

##### Basics & ergonomics #####
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on
set -g allow-rename off
set -g mouse on
set -g focus-events on

##### Navigation & panes #####
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind | split-window -h
bind - split-window -v
bind -r M-Left  resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r M-Up    resize-pane -U 2
bind -r M-Down  resize-pane -D 2

# Switch windows with Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

##### Copy mode & clipboard #####
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Y send -X copy-selection-and-cancel
set -g set-clipboard on

##### Status line (top + transparent) #####
set -g status on
set -g status-position top
set -g status-interval 7
set -g status-style fg=colour244,bg=default
set -g status-bg default
set -g status-fg colour244

# Wider fields
set -g status-left-length 200
set -g status-right-length 200

# Left: session icon+name then window list on left
set -g status-justify left
set -g status-left "#[bg=default,fg=green] #S #[fg=colour240]| "
setw -g window-status-format         "#[fg=colour244,bg=default] #I:#W"
setw -g window-status-current-format "#[fg=yellow,bg=default] * #[underscore]#I:#W"

##### TPM and plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Right: prefix/copy/sync indicators + cyan date/time
set -g status-right "#{prefix_highlight} #{?pane_in_mode,Copy,} #{?pane_synchronized,Sync,}  #[fg=cyan]%Y-%m-%d %H:%M#[default] "

# Continuum options
set -g @continuum-save-interval '15'
# set -g @continuum-restore 'on'  # optional

# Initialize TPM (custom path; keep last)
run '~/dotfiles/.config/tmux/.tmux/plugins/tpm/tpm'
